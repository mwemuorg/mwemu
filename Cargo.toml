[workspace]
resolver = "2"
members = [
    "crates/mwemu",
    "crates/libmwemu",
    "crates/libmwemu/libraries/rs-header",
    "crates/pymwemu",
    "crates/cmwemu",
    "crates/mwemu-mcp",
    "crates/mwemu-x86-test",
]
default-members = [
    # The library crates + the CLI. `mwemu` is the only binary here (pymwemu ships
    # a second bin `stub_gen`, and mwemu-mcp is a server bin — both excluded), so a
    # bare `cargo run` unambiguously runs the mwemu CLI while a bare `cargo test`
    # still runs the whole library suite (libmwemu, rs-header, cmwemu).
    # For the excluded crates: `cargo test -p pymwemu`, `cargo run -p mwemu-mcp`,
    # or `--workspace` for everything at once.
    "crates/mwemu",
    "crates/libmwemu",
    "crates/libmwemu/libraries/rs-header",
    "crates/cmwemu",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/mwemuorg/mwemu"
description = "x86 32/64bits and system internals emulator, for securely emulating malware and other stuff."

[workspace.dependencies]
# Only the CLI lives in this repo now; the library and bindings are their own
# repos under mwemuorg. The CLI just needs these — everything else moved with
# libmwemu/pymwemu/etc.
clap = "2.33.3"
log = "0.4.22"
fast_log = "1.7"
env_logger = "0.11.8"
libmwemu = { path = "crates/libmwemu", version = "0.25.4" }

[profile.release]
debug = 0
strip = true
opt-level = 3
panic = 'unwind'

[profile.dev]
debug = "full"
#opt-level = 1
opt-level = 0
panic = 'unwind'

[profile.dev-debug]
inherits = 'dev'
opt-level = 0
panic = 'unwind'

[profile.profiler]
inherits  = 'dev'
debug = 2
opt-level = 2
panic = 'unwind'
