[package]
name = "mwemu-core"
version = "1.0.0"
edition = "2024"
authors = ["sha0coder"]
license = "Apache-2.0"
rust-version = "1.95"
description = "Emulator core of libmwemu: CPU engines, memory maps, loaders, syscalls and emulated OS state. Use libmwemu instead of depending on this directly."
homepage = "https://mwemu.github.io/"
repository = "https://github.com/mwemuorg/mwemu"
publish = false

[dependencies]
rs-header = { path = "../libmwemu/libraries/rs-header", version = "0.1.3" }
iced-x86 = { version = "1.21.0", features = ["serde"] }
yaxpeax-arm = "0.4.0"
yaxpeax-arch = "0.3.2"
goblin = "0.9"
uint = "0.10"
md5 = "0.7.0"
lazy_static = "1.4.0"
rand = "0.9.1"
ctrlc = "3.2.2"
scan_fmt = "0.2.6"
csv = "1.3.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.22"
serde = { version = "1.0.217", features = ["derive"] }
ahash = { version = "0.8.12", features = ["serde"] }
bitfield = "0.19.1"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde_arrays = "0.2.0"
serde_json = "1"
slab = { version = "0.4.10", features = ["serde"] }
bytemuck = { version = "1.23.1", features = ["extern_crate_alloc"] }
fast_log = "1.7"
nohash-hasher = "0.2.0"
memmap2 = "0.9.7"
byteorder = "1.5.0"
thiserror = "2.0.12"
tempfile = "3.23.0"
tempdir = "0.3.7"
serial_test = "3.4.0"
dunce = "1.0.5"
soft-canonicalize = { version = "0.5", features = ["dunce"] }
flate2 = "1"
sha1 = "0.10.7"
sha2 = "0.10.8"
aes = "0.8.4"
des = "0.8.1"
hmac = "0.12.1"
pbkdf2 = "0.12.2"

[features]
default = []
log_mem_read = []
log_mem_write = []
# Never fetch DLLs from the symbol server. libmwemu turns this on for its test
# suite: those tests live outside this crate, so cfg(test) is not set here.
offline = []
