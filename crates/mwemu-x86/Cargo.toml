[package]
name = "mwemu-x86"
version = "1.0.0"
edition = "2024"
authors = ["sha0coder"]
license = "Apache-2.0"
rust-version = "1.95"
description = "x86 and x86-64 instruction semantics of libmwemu. Use libmwemu instead of depending on this directly."
homepage = "https://mwemu.github.io/"
repository = "https://github.com/mwemuorg/mwemu"
publish = false

[dependencies]
mwemu-core = { path = "../mwemu-core" }
iced-x86 = { version = "1.21.0", features = ["serde"] }
lazy_static = "1.4.0"
log = "0.4.22"
