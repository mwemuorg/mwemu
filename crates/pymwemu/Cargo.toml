[package]
name = "pymwemu"
version = "0.11.7"
edition = "2024"
rust-version.workspace = true
description = "Python bindings for libmwemu: an x86 32/64bits and system internals emulator for securely emulating malware."
homepage = "http://mwemu.github.io/#pymwemu"
repository = "https://github.com/mwemuorg/pymwemu"
license = "Apache-2.0"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_pymwemu"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.26.0"
env_logger = "0.11.8"
libmwemu = { path = "../libmwemu", version = "0.25.4" }
log = "0.4.22"
pyo3-stub-gen = "0.22.3"

[build-dependencies]
pyo3-build-config = "0.26.0"

[features]
extension-module = ["pyo3/extension-module"]
# cargo strips libpython from stub_gen, because of extension-module
# so we set default to none
default = []
