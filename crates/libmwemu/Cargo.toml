[package]
name = "libmwemu"
version = "1.0.1"
edition = "2024"
authors = ["sha0coder"]
license = "Apache-2.0"
rust-version = "1.95"
description = "x86 32/64bits and system internals emulator, for securely emulating malware and other stuff."
documentation = "https://docs.rs/libmwemu"
homepage = "https://mwemu.github.io/"
repository = "https://github.com/mwemuorg/mwemu"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mwemu-core = { path = "../mwemu-core" }
mwemu-debug = { path = "../mwemu-debug" }
mwemu-linux = { path = "../mwemu-linux" }
mwemu-macos = { path = "../mwemu-macos" }
mwemu-windows = { path = "../mwemu-windows" }
mwemu-winapi32 = { path = "../mwemu-winapi32" }
mwemu-winapi64 = { path = "../mwemu-winapi64" }

[dev-dependencies]
# The tests must never download DLLs; see the feature in mwemu-core.
mwemu-core = { path = "../mwemu-core", features = ["offline"] }
rs-header = { path = "./libraries/rs-header", version = "0.1.3" }
iced-x86 = { version = "1.21.0", features = ["serde"] }
csv = "1.3.0"
goblin = "0.9"
log = "0.4.22"
serde_json = "1"
minidump = "0.26.0"
tempfile = "3.23.0"
tempdir = "0.3.7"
dunce = "1.0.5"
env_logger = "0.11.8"
hex = "0.4.3"
itertools = "0.14"

[features]
default = []
log_mem_read = ["mwemu-core/log_mem_read"]
log_mem_write = ["mwemu-core/log_mem_write"]
# Gates the examples/ programs. Off by default so a plain `cargo build` or
# `cargo test` doesn't pay for compiling them; turn it on to run them:
#   cargo run -p libmwemu --features examples --example 01_shellcode
examples = []

[[example]]
name = "01_shellcode"
required-features = ["examples"]

[[example]]
name = "02_memory"
required-features = ["examples"]

[[example]]
name = "03_hooks"
required-features = ["examples"]

[[example]]
name = "04_load_binary"
required-features = ["examples"]

[[example]]
name = "05_bench"
required-features = ["examples"]
