[package]
name = "mwemu-debug"
version = "1.0.0"
edition = "2024"
authors = ["sha0coder"]
license = "Apache-2.0"
rust-version = "1.95"
description = "Debugger layer of libmwemu: the interactive console, the script runner, the gdb server and snapshots. Use libmwemu instead of depending on this directly."
homepage = "https://mwemu.github.io/"
repository = "https://github.com/mwemuorg/mwemu"
publish = false

[dependencies]
mwemu-core = { path = "../mwemu-core" }
rs-header = { path = "../libmwemu/libraries/rs-header", version = "0.1.3" }
iced-x86 = { version = "1.21.0", features = ["serde"] }
log = "0.4.22"
rand = "0.9.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1"
bitcode = { version = "0.6.3", features = ["std", "serde"] }
ahash = { version = "0.8.12", features = ["serde"] }
slab = { version = "0.4.10", features = ["serde"] }
minidump = "0.26.0"
byteorder = "1.5.0"
gdbstub = "0.7.10"
gdbstub_arch = "0.3.3"
