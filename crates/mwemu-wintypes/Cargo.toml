[package]
name = "mwemu-wintypes"
version = "1.0.0"
edition = "2024"
authors = ["sha0coder"]
license = "Apache-2.0"
rust-version = "1.95"
description = "Windows data types of libmwemu: the structures, the constants and the export index. Use libmwemu instead of depending on this directly."
homepage = "https://mwemu.github.io/"
repository = "https://github.com/mwemuorg/mwemu"
publish = false

[dependencies]
mwemu-maps = { path = "../mwemu-maps" }
rs-header = { path = "../libmwemu/libraries/rs-header", version = "0.1.3" }
ahash = { version = "0.8.12", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.22"
serde = { version = "1.0.217", features = ["derive"] }
