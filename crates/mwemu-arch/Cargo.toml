[package]
name = "mwemu-arch"
version = "1.0.0"
edition = "2024"
authors = ["sha0coder"]
license = "Apache-2.0"
rust-version = "1.95"
description = "CPU state of libmwemu: the x86 and AArch64 registers, flags and FPU. Use libmwemu instead of depending on this directly."
homepage = "https://mwemu.github.io/"
repository = "https://github.com/mwemuorg/mwemu"
publish = false

[dependencies]
mwemu-maps = { path = "../mwemu-maps" }
iced-x86 = { version = "1.21.0", features = ["serde"] }
log = "0.4.22"
rand = "0.9.1"
serde = { version = "1.0.217", features = ["derive"] }
uint = "0.10"
