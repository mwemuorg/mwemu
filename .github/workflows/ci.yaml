name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # rs-header is vendored in-tree (crates/libmwemu/libraries/rs-header), so
      # no submodules are needed. The full emulator now lives in this repo — the
      # library crates and bindings are all workspace members under crates/.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}

      # cargo directly (not `make`) so the same steps run on Windows too, whose
      # runners have no GNU make. These mirror the `clippy-release` / `test-ci`
      # Makefile targets for local use.
      - name: Clippy
        run: cargo clippy --release --lib --bins

      # Self-contained suite only: no sample bundle, no network. Binary-dependent
      # tests skip themselves (the `sample!` macro) when their sample is absent.
      - name: Test
        run: cargo test --verbose
