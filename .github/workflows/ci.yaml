name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy-linux-x86_64-unknown-linux-gnu
          add-rust-environment-hash-key: true
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Report Rust cache status
        run: echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: Run Clippy
        run: >-
          cargo clippy --locked
          --package mwemu
          --package libmwemu
          --package rs-header
          --package cmwemu
          --all-targets
          --target x86_64-unknown-linux-gnu

  test:
    name: Test (${{ matrix.target }})
    needs: fmt
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cache-key: test-linux-x86_64-unknown-linux-gnu
            # Portable baseline for CI: the committed .cargo/config.toml forces
            # `-C target-cpu=native`, which crashes with STATUS_ILLEGAL_INSTRUCTION
            # when cached artifacts built on one runner CPU run on another.
            rustflags: -C target-cpu=x86-64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cache-key: test-windows-x86_64-pc-windows-msvc
            rustflags: -C target-cpu=x86-64
          - os: macos-latest
            target: aarch64-apple-darwin
            cache-key: test-macos-aarch64-apple-darwin
            # No native flag in .cargo/config.toml for aarch64; keep the default.
            rustflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install nextest
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: nextest
          fallback: none

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.cache-key }}
          add-rust-environment-hash-key: true
          cache-on-failure: false
          cache-workspace-crates: false

      - name: Report Rust cache status
        run: echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: Test
        run: >-
          cargo nextest run --locked
          --package mwemu
          --package libmwemu
          --package rs-header
          --package cmwemu
          --target ${{ matrix.target }}
