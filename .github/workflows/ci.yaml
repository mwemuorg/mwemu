name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # panic-gate: disabled — the grep heuristics give inconsistent counts
  # across platforms. Run `bash scripts/panic-gate.sh` locally instead.

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy-linux-x86_64-unknown-linux-gnu
          add-rust-environment-hash-key: true
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Report Rust cache status
        run: echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: Run Clippy
        run: cargo clippy-all --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Check API, syscall, and kernel module coverage
        run: |
          python3 scripts/check_api_modules.py --self-test
          python3 scripts/check_api_modules.py --target x86_64-unknown-linux-gnu

  test:
    name: Test (${{ matrix.target }})
    needs: fmt
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cache-key: test-linux-x86_64-unknown-linux-gnu
            # Portable baseline for CI: the committed .cargo/config.toml forces
            # `-C target-cpu=native`, which crashes with STATUS_ILLEGAL_INSTRUCTION
            # when cached artifacts built on one runner CPU run on another.
            rustflags: -C target-cpu=x86-64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cache-key: test-windows-x86_64-pc-windows-msvc
            rustflags: -C target-cpu=x86-64
          - os: macos-latest
            target: aarch64-apple-darwin
            cache-key: test-macos-aarch64-apple-darwin
            # No native flag in .cargo/config.toml for aarch64; keep the default.
            rustflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.cache-key }}
          add-rust-environment-hash-key: true
          cache-on-failure: false
          cache-workspace-crates: false

      - name: Report Rust cache status
        run: echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: Test asset preparation
        run: python scripts/test_sync_assets.py

      - name: Run offline tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Sync release fixtures
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: python scripts/sync_assets.py test-fixtures

      - name: Prepare Windows maps
        if: runner.os == 'Windows'
        run: python scripts/sync_assets.py maps

      - name: Run Linux ELF tests
        if: runner.os == 'Linux'
        run: cargo test-elf --features host-tests --target ${{ matrix.target }}

      - name: Run asset tests
        if: runner.os == 'Windows'
        run: cargo test-assets -p libmwemu --lib --target ${{ matrix.target }}

      - name: Run macOS Mach-O tests
        if: runner.os == 'macOS'
        run: |
          make dyld
          cargo test-macho --features host-tests --target ${{ matrix.target }}

      - name: Set up MinGW for the driver fixture
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc

      - name: Build the Windows driver fixture
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make windows-driver CC=gcc DDK="$MINGW_PREFIX/include/ddk"

      - name: Test the Windows driver lifecycle
        if: runner.os == 'Windows'
        run: cargo test-windows-driver --target ${{ matrix.target }}

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv-linux-x86_64
          add-rust-environment-hash-key: true
          cache-on-failure: true

      - name: Check MSRV compiles
        run: cargo check --locked --target x86_64-unknown-linux-gnu

  # Fuzz smoke test disabled in CI — run locally with `make test_fuzz`.
  # fuzz-smoke:
  #   name: Fuzz smoke test
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 15
  #   needs: clippy
