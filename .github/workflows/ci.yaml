name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # rs-header is vendored in-tree (crates/libmwemu/libraries/rs-header), so
      # no submodules are needed. The full emulator now lives in this repo — the
      # library crates and bindings are all workspace members under crates/.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Add x86_64 target (macOS ARM)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}

      - name: Clippy
        run: make clippy-release

      # `make tests` runs the workspace library suite (libmwemu, rs-header,
      # cmwemu, and the mwemu CLI). It needs no external sample bundle — the
      # tests embed their fixtures via include_bytes!.
      - name: Test
        run: make tests
